<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B7A4D">
<title>Japan Trip Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233B7A4D'/%3E%3Ccircle cx='32' cy='30' r='12' fill='%23F4F1E8'/%3E%3Cpath d='M8 50q24-14 48 0v14H8z' fill='%23C6613A'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EEF2E6; --card:#FBFDF7; --ink:#1F3324; --muted:#62765F; --accent:#3E7B4F; --accent2:#C8643B;
  --line:#D5E0CC; --soft:#E3EBDA; --good:#3E7B4F; --bad:#B23A2E; --warn:#C8892B;
  --sky1:#A8D3E0; --sky2:#E3EFCF; --hdr:#1F3324; --hill1:#7FA36B; --hill2:#4F7A4A; --hill3:#2F5135;
  --serif:"Noto Serif","Noto Serif JP",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans JP",sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono","Droid Sans Mono",Menlo,Consolas,monospace;
  --r:16px; color-scheme:light;
}
[data-theme="earth"]{--bg:#F3EBDC;--card:#FFFBF3;--ink:#3A2A1E;--muted:#82684F;--accent:#B0532A;--accent2:#C99230;--line:#E4D3B8;--soft:#EDE0C8;--good:#5F7F32;
  --hill1:#D9B37A;--hill2:#B9844E;--hill3:#7A5233}
[data-theme="forest"]{--bg:#EDF2E5;--card:#FBFDF7;--ink:#1F3324;--muted:#5F745C;--accent:#3B7A4D;--accent2:#C6613A;--line:#D3DFC9;--soft:#E2EBD7;--good:#3B7A4D;
  --hill1:#8DB277;--hill2:#4E7D4A;--hill3:#2C4F33}
[data-theme="sea"]{--bg:#E7F0F2;--card:#F8FCFD;--ink:#12324A;--muted:#58758A;--accent:#1D7898;--accent2:#E0784E;--line:#CCDEE5;--soft:#DCEAEF;--good:#2C8A6A;
  --hill1:#7CC0D2;--hill2:#3E93B0;--hill3:#1F5F80}
[data-theme="wind"]{--bg:#ECF0F7;--card:#FBFCFF;--ink:#21304A;--muted:#64708C;--accent:#4569B3;--accent2:#D9A32E;--line:#D6DCEB;--soft:#E2E8F4;--good:#3D8B5E;
  --hill1:#B5CFA0;--hill2:#86AE78;--hill3:#5E8758}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 5%,transparent) 1px,transparent 1.2px);background-size:18px 18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
/* ---------- header sky ---------- */
.sky{position:relative;overflow:hidden;color:#fff;height:calc(292px + env(safe-area-inset-top,0px));background:var(--sky1);
  border-bottom-left-radius:28px;border-bottom-right-radius:28px}
#scn{position:absolute;inset:0}
#scn .paint{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block}
#hud{position:relative;z-index:2;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.hud{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;text-shadow:0 1px 10px rgba(0,20,40,.35),0 1px 2px rgba(0,20,40,.25)}
.brand{display:flex;gap:10px;align-items:center}
.brand b{display:block;font:700 19px/1.15 var(--serif);letter-spacing:.005em}
.brand small{display:block;font:500 12.5px/1.3 var(--sans);opacity:.92;margin-top:2px}
.seal{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#C8452C;color:#FFF4E6;font:700 19px/1 var(--serif);
  text-shadow:none;box-shadow:inset 0 0 0 2px rgba(255,244,230,.55),0 2px 8px rgba(0,0,0,.18);transform:rotate(-4deg)}
.hr-right{display:flex;gap:10px;align-items:flex-start}
.clock{text-align:right}
.clock b{display:block;font:600 28px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock span{font:500 12px var(--sans);opacity:.92}
.iconbtn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}
.sheet .iconbtn{border-color:var(--line);background:var(--soft)}
.iconbtn svg{width:19px;height:19px}
.hud.light{color:#1E2733;text-shadow:none}
.hud.light .iconbtn{color:#1E2733;border-color:rgba(30,39,51,.18);background:rgba(255,255,255,.45)}
.journey{margin-top:-34px;z-index:3;padding:12px 14px 8px}
.jtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.jnow{font:700 18px/1.2 var(--serif)}
.jsub{font-size:13px;color:var(--muted);margin-top:1px}
.jco{font-size:10.5px;line-height:1.35;color:var(--muted);text-align:right;padding-top:3px}
.jtrack{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.jtrack text{font:500 9px var(--sans);fill:var(--muted)}
.jtrack .jt-past{fill:var(--ink)}
.jtrack .jt-cur{font-weight:700;font-size:10px;fill:var(--accent2)}
@media (prefers-reduced-motion:no-preference){
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
}
@keyframes pulse{50%{transform:scale(1.35);opacity:.08}}
@media (prefers-reduced-motion:no-preference){
  .drift{animation:drift 60s linear infinite}
  .drift.slow{animation-duration:95s}
  .bob{animation:bob 6s ease-in-out infinite}
  .glow{transform-box:fill-box;transform-origin:center;animation:glow 2.4s ease-in-out infinite}
  .twinkle{animation:tw 3s ease-in-out infinite}
  .sway{transform-origin:bottom;animation:sway 4s ease-in-out infinite}
}
@keyframes drift{from{transform:translateX(-30%)}to{transform:translateX(130%)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes glow{50%{transform:scale(1.4);opacity:.2}}
@keyframes tw{50%{opacity:.25}}
@keyframes sway{50%{transform:rotate(4deg)}}
/* ---------- banners ---------- */
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px dashed}
.banner.preview{background:color-mix(in srgb,var(--accent2) 14%,var(--card));border-color:var(--accent2)}
.banner.manual{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:var(--accent)}
.banner.err{background:#fde8e5;border-color:var(--bad);color:#6d1d14}
.banner.backup{background:var(--card);border-color:var(--line)}
.banner b{font-family:var(--mono)}
.banner .sp{flex:1}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.chipbtn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
/* ---------- cards ---------- */
h2.sec{font:700 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px;display:flex;align-items:center;gap:8px}
h2.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 4%,transparent),0 8px 24px -16px color-mix(in srgb,var(--ink) 30%,transparent)}
.card + .card{margin-top:10px}
.hudcard::before,.hudcard::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--accent);pointer-events:none}
.hudcard::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
.hudcard::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}
.tag{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.tag .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.now .tag{color:var(--accent)}
.now .tag .dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.next .tag{color:var(--accent2)}
.next .tag .dot{background:var(--accent2)}
.steptitle{font:700 20px/1.25 var(--serif);margin:8px 0 4px}
.next .steptitle{font-size:18px}
.place{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px}
.place svg{width:15px;height:15px;flex:none;color:var(--accent)}
.detail{margin:8px 0 0;font-size:14.5px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meta .t{font:600 15px var(--mono)}
.meta .rel{font:500 12.5px var(--mono);color:var(--muted)}
.count{font:700 26px/1 var(--mono);color:var(--accent2);letter-spacing:-.02em}
.count small{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
.prog{height:4px;border-radius:4px;background:var(--soft);margin:12px 0 2px;overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:10px;background:var(--soft);font-size:14px;cursor:pointer}
.checks input{appearance:none;flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;margin:0;display:grid;place-items:center;background:var(--card)}
.checks input:checked{background:var(--accent);border-color:var(--accent)}
.checks input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.checks input:checked + span{text-decoration:line-through;color:var(--muted)}
.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.wide{flex:1}
.btn svg{width:17px;height:17px}
.later{display:grid;gap:0;margin-top:2px}
.later .li{display:grid;grid-template-columns:52px 22px 1fr;gap:6px;align-items:center;padding:9px 2px;border-top:1px dashed var(--line);font-size:14px}
.later .li:first-child{border-top:0}
.later .li .t{font:600 13px var(--mono);color:var(--muted)}
.ico{width:20px;height:20px;color:var(--accent)}
.ico.k-flight{color:#5773c4}.ico.k-train{color:var(--accent)}.ico.k-eat{color:var(--accent2)}.ico.k-see{color:#b0443a}
.ico.k-stay{color:#7a5aa8}.ico.k-test{color:#c08a1e}.ico.k-shop{color:#c2508a}.ico.k-task{color:var(--muted)}
/* ---------- money ring ---------- */
.ringrow{display:flex;gap:14px;align-items:center}
.ring{flex:none;width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .c b{font:700 17px var(--mono)}
.ring .c small{font:500 10px var(--mono);color:var(--muted);letter-spacing:.08em}
.big{font:700 22px/1.15 var(--mono);letter-spacing:-.02em}
.big small{font-size:13px;color:var(--muted);font-weight:500}
.sub{color:var(--muted);font-size:13px}
.ok{color:var(--good)} .over{color:var(--bad)}
.cats{display:grid;gap:7px;margin-top:12px}
.cat{display:grid;grid-template-columns:74px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.cat .bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:8px;background:var(--accent)}
.cat .bar i.over{background:var(--bad)}
.cat .v{font:500 12px var(--mono);text-align:right;color:var(--muted);white-space:nowrap}
.stack{height:14px;border-radius:8px;overflow:hidden;display:flex;background:var(--soft);margin:10px 0 6px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
table.days{width:100%;border-collapse:collapse;font-size:13px}
table.days td{padding:8px 4px;border-top:1px dashed var(--line);vertical-align:middle}
table.days td.n{font:500 12.5px var(--mono);text-align:right;white-space:nowrap}
table.days tr.today td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.minibar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;min-width:50px}
.minibar i{display:block;height:100%;background:var(--accent)}
.minibar i.over{background:var(--bad)}
.exp{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px dashed var(--line);cursor:pointer}
.exp:first-child{border-top:0}
.exp .em{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--soft)}
.exp .em svg{width:16px;height:16px}
.exp .a{font:600 14px var(--mono);text-align:right}
.exp .a small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.exp .nt{font-size:14px}
.exp .nt small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
/* ---------- day view ---------- */
.daychips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:14px -14px 0;padding-left:14px;padding-right:14px;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.dchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:7px 10px;text-align:center;min-width:58px}
.dchip b{display:block;font:700 15px var(--mono)}
.dchip small{font:600 10.5px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dchip.on small{color:#fff;opacity:.85}
.dchip.past{opacity:.6}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dayhead h3{margin:0;font:700 20px/1.2 var(--serif)}
.tl{position:relative;margin-top:12px}
.tl::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:var(--line)}
.st{position:relative;display:grid;grid-template-columns:48px 22px 1fr;gap:8px;padding:9px 4px;border-radius:12px;cursor:pointer;align-items:start}
.st .t{font:600 13px var(--mono);color:var(--muted);padding-top:2px;text-align:right}
.st .nd{width:14px;height:14px;border-radius:50%;margin:3px 0 0 3px;background:var(--card);border:2px solid var(--line);position:relative;z-index:1}
.st .bd b{display:block;font-size:14.5px;font-weight:600}
.st .bd span{display:block;font-size:12.5px;color:var(--muted)}
.st.done .nd{background:var(--accent);border-color:var(--accent)}
.st.done .bd{opacity:.6}
.st.cur{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.st.cur .nd{background:var(--accent2);border-color:var(--accent2);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent2) 25%,transparent)}
.st.opt .bd b::after{content:"optional";margin-left:6px;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);border:1px solid;border-radius:6px;padding:0 4px;vertical-align:2px}
.st .edited{font:600 10px var(--mono);color:var(--accent);margin-left:4px}
.st.hid{opacity:.45}
.st.hid .bd b{text-decoration:line-through}
.zoneflag{font:600 10px var(--mono);color:var(--accent2);margin-left:4px}
/* ---------- info ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:8px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kv dd{margin:0}
.kv a,.lnk{color:var(--accent);font-weight:600;text-decoration:none}
.ja{font-size:17px;font-weight:600;margin-top:6px}
.list{margin:6px 0 0;padding-left:18px;font-size:14px}
.list li{margin:4px 0}
.taxi{position:fixed;inset:0;z-index:60;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;padding:28px;text-align:center}
.taxi .j{font:800 clamp(28px,9vw,44px)/1.35 var(--sans)}
.taxi .e{margin-top:18px;font-size:16px;color:#444}
.taxi .h{font-size:15px;color:#666;margin-bottom:18px}
/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);box-shadow:0 -6px 18px -12px color-mix(in srgb,var(--ink) 40%,transparent);
  border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;justify-content:center}
.tabs .in{display:flex;gap:2px;max-width:560px;flex:1;align-items:center}
.tab{flex:1;border:0;background:transparent;padding:6px 0;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:600 11px var(--sans)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);background:var(--soft)}
.fab{flex:none;width:54px;height:54px;border-radius:18px;border:0;background:var(--accent2);color:#fff;display:grid;place-items:center;margin:-22px 4px 0;box-shadow:0 8px 20px -8px var(--accent2)}
.fab svg{width:26px;height:26px}
/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,15,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-width:600px;margin:0 auto;
  box-shadow:0 -10px 40px -10px rgba(0,0,0,.3)}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font:700 19px var(--serif);display:flex;justify-content:space-between;align-items:center}
.f{display:grid;gap:5px;margin-bottom:12px}
.f > span{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.inp{min-height:84px;resize:vertical}
.amount{font:700 30px var(--mono);text-align:center;padding:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:9px 6px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.conv{font:500 13px var(--mono);color:var(--muted);text-align:center;margin-top:-4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--card);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.small{font-size:12.5px;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
.pre{white-space:pre-wrap}
.tiny{font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em}
.foot{margin:26px 0 8px;text-align:center}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

.lite *,.lite *::before,.lite *::after{animation:none!important;transition:none!important}
.paused *{animation-play-state:paused!important}

</style>
</head>
<body>
<header class="sky" id="hdr"></header>
<main class="wrap" id="app"></main>

/* ===== SIMPLE HEADER SCENES — flat, calm, no blobs ===== */
const SW = 800, SH = 440;
function srng(seed){ let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sHex(h){ h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
function sMix(a, b, t){ const A = sHex(a), B = sHex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const s1 = n => n.toFixed(1);

/* palette: sky top, sky bottom, 4 ridges back→front, sun */
const SPAL = {
  earth: {sky:['#EBC9A0','#F7E9D4'], r:['#E2B88E','#CF946A','#B0704C','#7E4A33'], sun:'#C8452C'},
  forest:{sky:['#C9DFCB','#EFF4E7'], r:['#AECBA8','#84AC82','#5C8C61','#3B6948'], sun:'#FFFDF4'},
  sea:   {sky:['#B8DCE8','#EDF6F4'], r:['#A3CEDC','#74B2C8','#4690B0','#256A8C'], sun:'#FFFFFF'},
  wind:  {sky:['#CFDBF0','#F4F2F8'], r:['#C3CEE6','#A6B4D7','#8894C2','#6772A6'], sun:'#FFFFFF'}
};
const SPHASE = {
  day:null,
  dawn:{sky:['#EDB9AC','#FAE3CF'], tint:'#F2B3A0', k:.22, sun:'#FFF1DE'},
  dusk:{sky:['#D98A7E','#F4C9A6'], tint:'#6A3E62', k:.42, sun:'#FFE2B0'},
  night:{sky:['#16203D','#34406A'], tint:'#111933', k:.66, sun:'#F3EFDD'}
};
function sPal(theme, ph){
  const b = SPAL[theme], p = SPHASE[ph];
  if (!p) return {sky:b.sky, r:b.r, sun:b.sun, dark:false};
  return {sky:p.sky, r:b.r.map(c => sMix(c, p.tint, p.k)), sun:theme === 'earth' && ph !== 'night' ? sMix(b.sun, p.sun, .35) : p.sun, dark:ph === 'night' || ph === 'dusk'};
}
function sRidge(yBase, amp, seed, freq, bottom = SH){
  const r = srng(seed), p = [r() * 6, r() * 6];
  let d = `M0 ${bottom} L`;
  for (let x = 0; x <= SW; x += 5){

  const n = STOPS.length, cs = st.phase === 'pre' ? 0 : st.phase === 'post' ? n - 1 : st.cur.s;
  const W = 360, x0 = 14, gap = (W - 2 * x0) / (n - 1);
  let track = `<line x1="${x0}" y1="11" x2="${W - x0}" y2="11" stroke="var(--line)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>`;
  if (cs > 0) track += `<line x1="${x0}" y1="11" x2="${x0 + cs * gap}" y2="11" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>`;
  STOPS.forEach((p, i) => {
    const x = x0 + i * gap, cur = i === cs && st.phase !== 'post', past = i < cs || st.phase === 'post';
    track += cur
      ? `<circle class="pulse" cx="${x}" cy="11" r="10" fill="var(--accent2)" opacity=".22"/><circle cx="${x}" cy="11" r="5.5" fill="var(--accent2)" stroke="var(--card)" stroke-width="2"/>`
      : `<circle cx="${x}" cy="11" r="${past ? 3.6 : 3.2}" fill="${past ? 'var(--accent)' : 'var(--card)'}" stroke="${past ? 'var(--accent)' : 'var(--muted)'}" stroke-width="1.4"/>`;
    track += `<text x="${x}" y="34" text-anchor="middle" class="${cur ? 'jt-cur' : past ? 'jt-past' : 'jt-fut'}">${esc(p.n)}</text>`;
  });
  let head = '', sub = '', coord = '';
  if (st.phase === 'pre'){ const f = visible()[0]; head = 'Saigon'; sub = `Leaving ${dayName(f.d)}, Grab at 21:00`; }
  else if (st.phase === 'post'){ head = 'Home'; sub = 'Trip complete · おかえり'; }
  else {
    const c = st.cur, city = CITIES[c.c], base = STOPS[c.s].n;
    if (c.c === 'AIR'){ head = 'In the air'; sub = `${c.p} · ${c.ti.split(' · ')[0]}`; }
    else { head = city.n; sub = c.c === 'NARA' || c.c === 'KYO' ? 'Day trip' : '';
    if (!sub) sub = ''; }
    const nx = st.L.slice(st.i + 1).find(x => x.s > c.s);
    if (nx){ const when = nx.d === c.d ? 'at ' + nx.t : 'on ' + dayInfo(nx.d).w + ' ' + +nx.d.slice(3); sub += sub ? ` · next stop ${STOPS[nx.s].n} ${when}` : `Next stop ${STOPS[nx.s].n} ${when}`; }
    if (city.lat != null) coord = `${city.lat.toFixed(2)}°N<br>${city.lon.toFixed(2)}°E`;
  }
  return `<section class="card journey"><div class="jtop"><div><div class="jnow">${esc(head)}</div>${sub ? `<div class="jsub">${esc(sub)}</div>` : ''}</div>${coord ? `<div class="jco mono">${coord}</div>` : ''}</div>
    <svg class="jtrack" viewBox="0 0 ${W} 42" role="img" aria-label="Journey: stop ${cs + 1} of ${n}">${track}</svg></section>`;
}

/* ---------- UI state ---------- */
let tab = 'now', viewDay = null, dayFilter = 'today', sceneKey = '';
const app = () => $('#app');

function render(){
  applyLite();
  const st = status(), z = zoneNow(st), ph = applySky(z), now = nowMs(), t = inZone(now, z);
  const dayNo = st.phase === 'trip' ? DAYS.findIndex(d => d.d === st.cur.d) + 1 : 0;
  const sk = theme + ph;
  if (sk !== sceneKey){ sceneKey = sk; $('#scn').innerHTML = sceneHTML(theme, ph); }
  $('#hud').innerHTML = `<div class="wrap hud ${ph === 'day' || ph === 'dawn' ? 'light' : ''}"><div class="brand"><span class="seal">旅</span><div><b>Japan, autumn ’26</b><small>${st.phase === 'pre' ? 'Before departure' : st.phase === 'post' ? 'Trip complete' : `Day ${dayNo} of ${DAYS.length} · ${esc(dayInfo(st.cur.d).label)}`}</small></div></div>
    <div class="hr-right"><div class="clock"><b>${pad(t.h)}:${pad(t.mi)}</b><span>${WD[t.wd]} ${t.d} ${MO[t.mo - 1]} · ${ZONE_SHORT[z]}</span></div>
    <button class="iconbtn" id="gear" aria-label="Settings">${ic('gear')}</button></div></div>`;
  $('#gear').onclick = () => openSettings();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const v = {now:viewNow, day:viewDayTab, money:viewMoney, info:viewInfo}[tab](st);
  app().innerHTML = journeyHTML(st) + banners(st) + v;
  wire(st);
}

function banners(st){
  let h = '';
  if (!storageOK) h += `<div class="banner err">Saving is blocked in this browser view. Use <b>Export</b> after adding expenses, or open the file in Chrome.</div>`;
  if (preview != null){
    const z = zoneNow(st);
    h += `<div class="banner preview"><span>Preview <b>${dateLabel(preview, z)} ${hm(preview, z)} ${ZONE_SHORT[z]}</b></span><span class="sp"></span>
      <button class="chipbtn" data-pv="-60">−1h</button><button class="chipbtn" data-pv="60">+1h</button><button class="chipbtn" data-pv="step">Next step</button><button class="chipbtn solid" data-pv="off">Exit</button></div>`;
  }
  if (st.manual){
    const late = st.next && nowMs() > st.next.ms ? ` · next was planned ${dur(nowMs() - st.next.ms)} ago` : '';
    h += `<div class="banner manual"><span>Following you manually${late}</span><span class="sp"></span><button class="chipbtn solid" data-act="auto">Back to clock</button></div>`;
  }
  const n = S.expenses.length - S.exportedCount;
  if (tab === 'money' && n > 0 && (n >= 5 || (S.lastExport && Date.now() - S.lastExport > 2 * 864e5) || !S.lastExport && n >= 3))
    h += `<div class="banner backup"><span>${n} new expense${n > 1 ? 's' : ''} since your last backup</span><span class="sp"></span><button class="chipbtn solid" data-act="export">Export</button></div>`;
  return h;
}

/* ----- NOW tab ----- */
function checklist(step){
  if (!step.ck.length) return '';
  return `<ul class="checks">${step.ck.map((c, i) => `<li><label><input type="checkbox" data-ck="${esc(step.id)}:${i}" ${S.checks[step.id + ':' + i] ? 'checked' : ''}><span>${esc(c)}</span></label></li>`).join('')}</ul>`;
}
function stepHead(step){
  return `<div class="place">${ic('pin')}<span>${esc(step.p)}</span></div>`;
}
function zoneNote(a, b){ return a && b && a.z !== b.z ? ` <span class="zoneflag">clock ${b.z > a.z ? '+' : '−'}${Math.abs(b.z - a.z)}h</span>` : ''; }
function viewNow(st){
  const now = nowMs(); let h = '';
  if (st.phase === 'pre'){
    const n = st.next;
    h += `<h2 class="sec">Countdown</h2><div class="card hudcard next"><span class="tag"><i class="dot"></i>Departure in</span>
      <div class="count" style="margin-top:8px">${dur(n.ms - now)}</div>
      <div class="sub" style="margin-top:4px">First step: ${dayName(n.d)} · ${n.t} ${ZONE_SHORT[n.z]} — ${esc(n.ti)}</div></div>`;
    h += `<h2 class="sec">Before you go</h2><div class="card"><ul class="checks" style="margin:0">${PRETRIP.map(([id, tx]) =>
      `<li><label><input type="checkbox" data-ck="todo:${id}" ${S.checks['todo:' + id] ? 'checked' : ''}><span>${esc(tx)}</span></label></li>`).join('')}</ul></div>`;
    h += `<h2 class="sec">First step</h2>` + nextCard(n, now, null);
    return h + moneyMini(st);
  }
  if (st.phase === 'post'){
    const m = tripMoney(st);
    h += `<h2 class="sec">おかえり</h2><div class="card hudcard now"><div class="steptitle">Welcome home</div>
      <div class="sub">Trip total: <b class="mono">${fmt(m.prepaid + m.spent, 'VND', {short:true})}</b> of ${fmt(m.cap, 'VND', {short:true})} · shopping ${fmt(m.shopping, 'VND', {short:true})}</div>
      <div class="sub" style="margin-top:6px">HSK4 results ~21–23 Nov at hskibt.jp</div>
      <div class="row2"><button class="btn primary wide" data-act="export">${ic('download')} Export final backup</button></div></div>`;
    return h;
  }
  const c = st.cur, n = st.next;
  const span = n ? n.ms - c.ms : 1, el = Math.max(0, Math.min(1, (now - c.ms) / span));
  const since = now - c.ms;
  h += `<h2 class="sec">Now</h2><div class="card hudcard now"><div class="meta"><span class="tag"><i class="dot"></i>${st.manual ? 'You are here' : 'Now'}</span>
      <span class="rel">${c.t} ${ZONE_SHORT[c.z]} · ${st.manual ? 'set by you' : since >= 0 ? 'started ' + dur(since) + ' ago' : 'in ' + dur(since)}</span></div>
    <div class="steptitle">${esc(c.ti)}</div>${stepHead(c)}${c.de ? `<p class="detail">${esc(c.de)}</p>` : ''}${checklist(c)}
    ${n ? `<div class="prog" aria-hidden="true"><i style="width:${(el * 100).toFixed(1)}%"></i></div>` : ''}
    <div class="row2">${n ? `<button class="btn primary wide" data-act="advance">${ic('next')} Done · on to next</button>` : ''}
      <button class="btn" data-act="pickday">${ic('here')} I’m elsewhere</button></div></div>`;
  if (n) h += `<h2 class="sec">Next</h2>` + nextCard(n, now, c);
  const later = st.L.slice(st.i + 2).filter(x => x.d === c.d).slice(0, 4);
  if (later.length) h += `<h2 class="sec">Later today</h2><div class="card later">${later.map(x =>
    `<div class="li" data-step="${esc(x.id)}"><span class="t">${x.t}</span>${ic(x.k, 'ico k-' + x.k)}<span>${esc(x.ti)}</span></div>`).join('')}</div>`;
  return h + moneyMini(st);
}
function nextCard(n, now, c){
  return `<div class="card next" data-step="${esc(n.id)}"><div class="meta"><span class="tag"><i class="dot"></i>Next</span>
    <span class="rel">${dayName(n.d)} · ${n.t} ${ZONE_SHORT[n.z]}${zoneNote(c, n)}</span></div>
    <div class="count" style="margin-top:8px">${n.ms - now >= 0 ? 'in ' + dur(n.ms - now) : dur(now - n.ms) + '<small>overdue</small>'}</div>
    <div class="steptitle">${esc(n.ti)}</div>${stepHead(n)}${n.de ? `<p class="detail">${esc(n.de)}</p>` : ''}${checklist(n)}</div>`;
}
function ring(spent, budget, cur){
  const p = budget > 0 ? spent / budget : (spent > 0 ? 1.01 : 0), C = 2 * Math.PI * 40;
  const col = p > 1 ? 'var(--bad)' : p > .85 ? 'var(--warn)' : 'var(--accent)';
  return `<div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--soft)" stroke-width="9"/>
    ${p > 0 ? `<circle cx="48" cy="48" r="40" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(Math.min(p, 1) * C).toFixed(1)} ${C.toFixed(1)}"/>` : ''}</svg>
    <div class="c"><div><b>${budget > 0 ? Math.round(p * 100) + '%' : '—'}</b><br><small>USED</small></div></div></div>`;
}
function todayRing(st){
  const d = activeDay(st), cur = ZONE_CUR[zoneNow(st)];
  const b = budgetV(d), s = spentV(d), left = b - s;
  return `<div class="ringrow">${ring(s, b, cur)}
    <div><div class="big">${fmtV(s, cur)} <small>/ ${fmtV(b, cur)}</small></div>
    <div class="sub ${left < 0 ? 'over' : 'ok'}">${left < 0 ? fmtV(-left, cur) + ' over' : fmtV(left, cur) + ' left today'}</div>
    <div class="tiny" style="margin-top:4px">${cur !== 'VND' ? '≈ ' + fmt(s, 'VND', {short:true}) + ' / ' + fmt(b, 'VND', {short:true}) : ''}</div></div></div>`;
}
function moneyMini(st){
  if (activeDay(st) === 'pre'){
    const m = tripMoney(st);
    return `<h2 class="sec">Budget</h2><div class="card" data-go="money"><div class="big">${fmt(m.projected, 'VND', {short:true})} <small>planned of ${fmt(m.cap, 'VND', {short:true})}</small></div>
      <div class="sub">Prepaid ${fmt(m.prepaid, 'VND', {short:true})} · daily budgets ${fmt(m.planned, 'VND', {short:true})}</div></div>`;
  }
  return `<h2 class="sec">Today’s budget</h2><div class="card" data-go="money">${todayRing(st)}</div>`;

/* ----- DAY tab ----- */
function viewDayTab(st){
  const today = activeDay(st);

  const chips = DAYS.map(d => {
    const past = st.phase === 'post' || (today !== 'pre' && d.d < today);
    return `<button class="dchip ${d.d === viewDay ? 'on' : ''} ${past ? 'past' : ''}" data-day="${d.d}"><small>${d.w}</small><b>${+d.d.slice(3)}</b></button>`;
  }).join('');
  const b = budgetV(viewDay), s = spentV(viewDay), cur = day.cur;

      <div class="tl">${all.map(x => {
        const cls = x.hid ? 'hid' : x.id === curId ? 'cur' : (st.phase === 'post' || x.ms < curMs) ? 'done' : '';
        return `<div class="st ${cls} ${x.opt ? 'opt' : ''}" data-step="${esc(x.id)}"><span class="t">${x.t}${x.z !== day.z ? `<br><span class="zoneflag">${ZONE_SHORT[x.z]}</span>` : ''}</span><span class="nd"></span>
          <span class="bd"><b>${esc(x.ti)}${x.edited || x.custom ? '<span class="edited">✎</span>' : ''}</b><span>${esc(x.p)}</span></span></div>`;

/* ----- MONEY tab ----- */
function viewMoney(st){
  const today = activeDay(st), m = tripMoney(st);
  let h = '';
  if (today !== 'pre' && st.phase !== 'post'){
    const cur = ZONE_CUR[zoneNow(st)], bb = budgetOf(today);
    h += `<h2 class="sec">Today · ${dayName(today)}</h2><div class="card hudcard">${todayRing(st)}
      <div class="cats">${BUDGET_CATS.map(c => {
        const bv = toV(bb.cats[c] || 0, bb.cur), sv = spentV(today, c);
        if (!bv && !sv) return '';
        const p = bv ? sv / bv : 1;
        return `<div class="cat"><span>${CATS[c]}</span><span class="bar"><i class="${p > 1 ? 'over' : ''}" style="width:${Math.min(100, p * 100)}%"></i></span><span class="v">${fmtV(sv, cur)} / ${fmtV(bv, cur)}</span></div>`;
      }).join('')}</div>
      ${BUDGET_NOTES[today] ? `<div class="small" style="margin-top:10px">${esc(BUDGET_NOTES[today])}</div>` : ''}</div>`;
    const bal = m.balance;
    h += `<div class="card"><div class="tiny">RUNNING BALANCE · DAYS BEFORE TODAY</div><div class="big ${bal < 0 ? 'over' : 'ok'}" style="margin-top:4px">${bal < 0 ? fmtV(-bal, 'JPY') + ' behind' : fmtV(bal, 'JPY') + ' ahead'}</div>
      <div class="sub">${bal < 0 ? 'Spent more than the daily budgets so far.' : 'Unspent budget from earlier days, if you logged everything.'} ≈ ${fmt(Math.abs(bal), 'VND', {short:true})}</div></div>`;
  }
  const seg = (v, c) => `<i style="width:${(Math.max(0, v) / Math.max(m.cap, m.projected) * 100).toFixed(2)}%;background:${c}"></i>`;
  h += `<h2 class="sec">Whole trip</h2><div class="card"><div class="big">${fmt(m.prepaid + m.spent, 'VND', {short:true})} <small>used of ${fmt(m.cap, 'VND', {short:true})}</small></div>
    <div class="sub">Projected finish: <b class="mono ${m.projected > m.cap ? 'over' : 'ok'}">${fmt(m.projected, 'VND', {short:true})}</b> ${m.projected > m.cap ? '— over the cap' : '— ' + fmt(m.cap - m.projected, 'VND', {short:true}) + ' buffer'}</div>
    <div class="stack">${seg(m.prepaid, 'var(--muted)')}${seg(m.spent, 'var(--accent)')}${seg(m.remain, 'color-mix(in srgb,var(--accent) 30%,var(--soft))')}</div>
    <div class="legend"><span style="--c:var(--muted)">Prepaid ${fmt(m.prepaid, 'VND', {short:true})}</span><span style="--c:var(--accent)">Spent ${fmt(m.spent, 'VND', {short:true})}</span><span style="--c:color-mix(in srgb,var(--accent) 30%,var(--soft))">Still planned ${fmt(m.remain, 'VND', {short:true})}</span></div>
    <div class="hr"></div><div class="meta"><span>Shopping <span class="small">(outside budget)</span></span><b class="mono">${fmtV(m.shopping, 'JPY')} · ${fmt(m.shopping, 'VND', {short:true})}</b></div></div>`;
  h += `<h2 class="sec">By day</h2><div class="card"><table class="days">${DAYS.map(d => {
    const b = budgetV(d.d), s = spentV(d.d), p = b ? s / b : 0;
    return `<tr class="${d.d === today ? 'today' : ''}" data-day-m="${d.d}"><td>${d.w} ${+d.d.slice(3)}<div class="tiny">${esc(d.label)}</div></td><td style="width:34%"><div class="minibar"><i class="${p > 1 ? 'over' : ''}" style="width:${Math.min(100, p * 100)}%"></i></div></td>
      <td class="n">${fmtV(s, d.cur, {short:true})}<div class="tiny">/ ${fmtV(b, d.cur, {short:true})}</div></td></tr>`;
  }).join('')}</table></div>`;
  const opts = [['today', 'Today'], ['all', 'All']].concat(DAYS.map(d => [d.d, d.w + ' ' + +d.d.slice(3)]), [['pre', 'Before trip']]);
  const flt = dayFilter === 'today' ? today : dayFilter;
  const list = S.expenses.filter(e => flt === 'all' || e.d === flt).sort((a, b) => b.ts - a.ts);
  h += `<h2 class="sec">Expenses</h2><div class="card"><select class="inp" id="dayFilter" style="padding:8px 10px;font-size:14px">${opts.map(([v, l]) => `<option value="${v}" ${v === dayFilter ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <div style="margin-top:8px">${list.length ? list.map(e => `<div class="exp" data-exp="${esc(e.id)}"><span class="em">${ic(e.k)}</span>
      <span class="nt">${esc(e.n || CATS[e.k])}<small>${CATS[e.k]} · ${dayName(e.d)}</small></span>
      <span class="a">${fmt(e.a, e.c)}<small>${e.c !== 'VND' ? fmt(toV(e.a, e.c), 'VND', {short:true}) : ''}</small></span></div>`).join('') : '<div class="empty">Nothing yet. Tap + to add.</div>'}</div></div>`;
  h += `<h2 class="sec">Quick convert</h2><div class="card"><div class="grid2"><input class="inp mono" id="cvIn" inputmode="decimal" placeholder="¥ amount"><div class="inp mono" id="cvOut" style="background:var(--soft)">— ₫</div></div>
    <div class="tiny" style="margin-top:6px">¥1 = ${S.rates.JPY} ₫ · CN¥1 = ${S.rates.CNY} ₫ · change in Settings</div></div>`;
  return h;
}

/* ---------- wiring ---------- */
function wire(st){
  const A = app();
  A.querySelectorAll('[data-ck]').forEach(i => i.onchange = () => { i.checked ? S.checks[i.dataset.ck] = 1 : delete S.checks[i.dataset.ck]; save(); });
  A.querySelectorAll('[data-step]').forEach(el => el.addEventListener('click', ev => { if (ev.target.closest('label,button,input')) return; openStep(el.dataset.step); }));
  A.querySelectorAll('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
  A.querySelectorAll('[data-day]').forEach(el => el.onclick = () => { viewDay = el.dataset.day; safeRender(); });
  A.querySelectorAll('[data-day-m]').forEach(el => el.onclick = () => { tab = 'day'; viewDay = el.dataset.dayM; safeRender(); scrollTo(0, 0); });
  A.querySelectorAll('[data-exp]').forEach(el => el.onclick = () => openExpense(S.expenses.find(e => e.id === el.dataset.exp)));
  A.querySelectorAll('[data-taxi]').forEach(el => el.onclick = () => showTaxi(HOTELS[+el.dataset.taxi]));
  A.querySelectorAll('[data-pv]').forEach(el => el.onclick = () => {
    const v = el.dataset.pv;
    if (v === 'off') setPreview(null);
    else if (v === 'step'){ const L = visible(), n = L.find(x => x.ms > preview); setPreview(n ? n.ms : preview + H); }
    else setPreview(preview + (+v) * MIN);
    safeRender();
  });
  A.querySelectorAll('[data-act]').forEach(el => el.onclick = () => act(el.dataset.act, st));
  const df = $('#dayFilter'); if (df) df.onchange = () => { dayFilter = df.value; safeRender(); };
  const cv = $('#cvIn'); if (cv) cv.oninput = () => { const v = parseFloat(cv.value.replace(/,/g, '')); $('#cvOut').textContent = isFinite(v) ? fmt(toV(v, 'JPY'), 'VND') : '— ₫'; };
  const nt = $('#notes'); if (nt) nt.oninput = () => { S.notes = nt.value; save(); };
  const dc = $('#dchips .on'); if (dc) dc.scrollIntoView({inline:'center', block:'nearest'});
}
function act(a, st){
  if (a === 'auto'){ S.pin = null; save(); safeRender(); toast('Following the clock again'); }
  else if (a === 'advance'){ if (st.next){ S.pin = st.next.id; save(); safeRender(); scrollTo({top:0, behavior:'smooth'}); } }
  else if (a === 'pickday'){ tab = 'day'; viewDay = st.cur ? st.cur.d : DAYS[0].d; safeRender(); toast('Tap the step you’re at, then “I’m here”'); }
  else if (a === 'export') exportData();
  else if (a === 'addstep') openStepEdit(null, viewDay);
}
function go(t){ tab = t; if (t === 'day') viewDay = null; safeRender(); scrollTo(0, 0); }

/* ---------- sheets ---------- */
let sheetOpen = false, lastBack = 0;
const histOK = (() => { try { history.replaceState(history.state, ''); return true; } catch(e){ return false; } })();
const ours = st => st && typeof st === 'object' && (st.jtd === 'sheet' || st.jtd === 'taxi');
function pushLayer(kind){ if (!histOK) return; try { history.pushState({jtd:kind}, ''); } catch(e){} }
function popLayer(){ if (histOK && ours(history.state)){ try { history.back(); } catch(e){} } }
function openSheet(html, onWire){
  $('#sheet').innerHTML = `<div class="grab"></div>` + html;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  if (!sheetOpen){ sheetOpen = true; pushLayer('sheet'); }
  onWire && onWire($('#sheet'));
  $('#sheet').scrollTop = 0;
}
function closeSheet(fromPop){
  if (!sheetOpen) return; sheetOpen = false;
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  if (!fromPop) popLayer();
}
function closeTaxi(fromPop){ const tx = $('.taxi'); if (!tx) return; tx.remove(); if (!fromPop) popLayer(); }
function setupBackGuard(){
  if (!histOK) return;
  try {
    if (ours(history.state)) history.replaceState({jtd:'guard'}, '');
    else if (!history.state || history.state.jtd !== 'guard') history.pushState({jtd:'guard'}, '');
  } catch(e){ return; }
  addEventListener('popstate', ev => {
    const st = ev.state;
    if (st && st.jtd === 'guard'){ closeSheet(true); closeTaxi(true); return; }   // an overlay was closed
    if (ours(st)) return;
    // the guard itself was popped: user pressed / swiped Back on the main screen
    if (sheetOpen || $('.taxi')){ closeSheet(true); closeTaxi(true); try { history.pushState({jtd:'guard'}, ''); } catch(e){} return; }
    if (Date.now() - lastBack < 2500){ try { history.back(); } catch(e){} return; }
    lastBack = Date.now();
    try { history.pushState({jtd:'guard'}, ''); } catch(e){}
    toast('Swipe back again to leave the dashboard');
  });
}

    sh.querySelector('#pvOn').onclick = () => {
      const v = sh.querySelector('#pvT').value, zz = +sh.querySelector('#pvZ').value;
      const m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(v); if (!m) return toast('Pick a date and time');
      setPreview(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4] - zz, +m[5])); S.pin = null; save(); closeSheet(); tab = 'now'; safeRender(); scrollTo(0, 0);
    };
    const off = sh.querySelector('#pvOff'); if (off) off.onclick = () => { setPreview(null); closeSheet(); safeRender(); };
    sh.querySelector('#sWipe').onclick = () => {
      if (!confirm('Erase all expenses, ticks, edits and settings on this phone? Export first if unsure.')) return;
      S = defaults(); save(); invalidate(); closeSheet(); safeRender(); toast('All data erased');
    };
  });
}

/* ---------- import / export ---------- */
function payload(){ return {app:'japan-trip-dashboard', v:1, exported:new Date().toISOString(), data:S}; }
function stamp(){ const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; }
function markExported(){ S.lastExport = Date.now(); S.exportedCount = S.expenses.length; save(); }
function download(text, name, type){
  try {
    const url = URL.createObjectURL(new Blob([text], {type}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
  } catch(e){ return false; }
}
function exportData(){
  const txt = JSON.stringify(payload(), null, 1);
  if (download(txt, `japan-trip-backup-${stamp()}.json`, 'application/json')){ markExported(); toast('Backup saved to Downloads'); safeRender(); }
  else copyFallback(txt);
}
async function shareData(){
  const txt = JSON.stringify(payload());
  const file = new File([txt], `japan-trip-backup-${stamp()}.json`, {type:'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Japan trip backup'}); markExported(); toast('Shared'); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  copyFallback(txt);
}
function copyFallback(txt){
  openSheet(`<h3>Copy your backup</h3><p class="small">Downloading isn’t available here. Copy this text and keep it in Notes or send it to yourself.</p>
    <textarea class="inp mono" id="cpT" style="min-height:180px;font-size:12px" readonly>${esc(txt)}</textarea><div class="row2"><button class="btn primary wide" id="cpB">Copy</button></div>`, sh => {
    sh.querySelector('#cpB').onclick = async () => {
      const ta = sh.querySelector('#cpT');
      try { await navigator.clipboard.writeText(txt); } catch(e){ ta.select(); document.execCommand('copy'); }
      markExported(); toast('Copied');
    };
  });
}
function exportCSV(){
  const rows = [['date_logged','trip_day','category','note','amount','currency','amount_vnd']].concat(
    S.expenses.slice().sort((a, b) => a.ts - b.ts).map(e => [new Date(e.ts).toISOString(), e.d === 'pre' ? 'before trip' : '2026-' + e.d, e.k, e.n, e.a, e.c, Math.round(toV(e.a, e.c))]));
  const csv = '\ufeff' + rows.map(r => r.map(v => { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
  download(csv, `japan-trip-expenses-${stamp()}.csv`, 'text/csv') ? toast('CSV saved to Downloads') : toast('Couldn’t download here');
}
function importText(txt){
  let obj; try { obj = JSON.parse(txt); } catch(e){ return toast('That file isn’t a backup (not valid JSON)'); }
  const data = obj && obj.app === 'japan-trip-dashboard' ? obj.data : (obj && Array.isArray(obj.expenses) ? obj : null);
  if (!data) return toast('That file isn’t a Japan trip backup');
  const inc = sanitize(data), when = obj.exported ? new Date(obj.exported).toLocaleString() : 'unknown date';
  openSheet(`<h3>Import backup</h3><p>Backup from <b>${esc(when)}</b> with <b>${inc.expenses.length}</b> expenses, ${Object.keys(inc.edits).length + inc.custom.length} step edits.</p>
    <p class="small">This phone has ${S.expenses.length} expenses now.</p>
    <div class="row2"><button class="btn primary wide" id="imM">Merge</button><button class="btn danger wide" id="imR">Replace everything</button></div>
    <p class="small" style="margin-top:10px">Merge keeps everything on this phone and adds anything new from the backup. Replace makes this phone match the backup exactly.</p>`, sh => {
    sh.querySelector('#imR').onclick = () => { S = inc; save(); invalidate(); closeSheet(); safeRender(); toast('Backup restored'); };
    sh.querySelector('#imM').onclick = () => {
      const have = new Set(S.expenses.map(e => e.id)); let added = 0;
      inc.expenses.forEach(e => { if (!have.has(e.id)){ S.expenses.push(e); added++; } });
      Object.assign(S.checks, inc.checks);
      for (const k in inc.edits) if (!S.edits[k]) S.edits[k] = inc.edits[k];
      const ch = new Set(S.custom.map(c => c.id)); inc.custom.forEach(c => { if (!ch.has(c.id)) S.custom.push(c); });
      if (!S.notes && inc.notes) S.notes = inc.notes; else if (inc.notes && !S.notes.includes(inc.notes)) S.notes += '\n\n' + inc.notes;
      save(); invalidate(); closeSheet(); safeRender(); toast(`Merged · ${added} new expense${added === 1 ? '' : 's'}`);
    };
  });
}

/* ---------- taxi + toast ---------- */
function showTaxi(h){
  const el = document.createElement('div'); el.className = 'taxi'; el.setAttribute('role', 'dialog');
  el.innerHTML = `<div class="h">この住所までお願いします</div><div class="j">${esc(h.n)}<br>${esc(h.ja)}</div><div class="e">${esc(h.en)}${h.tel ? '<br>☎ ' + esc(h.tel) : ''}</div><div class="e" style="margin-top:30px;font-size:13px">Tap anywhere to close</div>`;
  el.onclick = () => closeTaxi();
  pushLayer('taxi');
  document.body.appendChild(el);
}
let tt; function toast(m){ let t = $('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; clearTimeout(tt); tt = setTimeout(() => t.remove(), 2600); }

/* ---------- health ---------- */
const DKEY = 'jtd.diag', LKEY = 'jtd.life';
function diag(msg){
  try { const a = JSON.parse(localStorage.getItem(DKEY) || '[]'); a.unshift({t:new Date().toISOString(), m:String(msg).slice(0, 300)}); localStorage.setItem(DKEY, JSON.stringify(a.slice(0, 12))); } catch(e){}
}
function diagList(){ try { return JSON.parse(localStorage.getItem(DKEY) || '[]'); } catch(e){ return []; } }
function life(vis){ try { localStorage.setItem(LKEY, JSON.stringify({vis:vis ? 1 : 0, t:Date.now()})); } catch(e){} }
let crashNote = false;
function checkLastSession(){
  let l = null; try { l = JSON.parse(localStorage.getItem(LKEY) || 'null'); } catch(e){}
  if (l && l.vis === 1 && Date.now() - l.t < 15 * MIN){
    diag('Previous session ended while open (last seen ' + new Date(l.t).toLocaleTimeString() + ')');
    if (!S.lite){ S.lite = true; save(); crashNote = true; }
  }
}
function applyLite(){ document.documentElement.classList.toggle('lite', !!S.lite); }
function storageKB(){ let n = 0; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); n += k.length + (localStorage.getItem(k) || '').length; } } catch(e){} return (n * 2 / 1024).toFixed(1); }
addEventListener('error', e => { diag('Error: ' + (e.message || e) + (e.lineno ? ' @' + e.lineno : '')); });
addEventListener('unhandledrejection', e => { diag('Promise: ' + (e.reason && e.reason.message || e.reason)); });
function safeRender(){
  try { render(); }
  catch(err){
    diag('Render failed: ' + (err && err.message || err));
    app().innerHTML = `<div class="banner err" style="margin-top:16px">Something went wrong drawing this screen. Your data is safe.</div>
      <div class="row2"><button class="btn primary wide" id="rcExp">Export backup</button><button class="btn wide" id="rcFix">Back to clock + Now</button></div>`;
    $('#rcExp').onclick = exportData;
    $('#rcFix').onclick = () => { S.pin = null; setPreview(null); tab = 'now'; save(); invalidate(); safeRender(); };
  }
}

/* ---------- boot ---------- */
function boot(){
  checkLastSession(); applyLite();
  $('#hdr').innerHTML = '<div id="scn"></div><div id="hud"></div>';
  $('#tabs').innerHTML = `<div class="in">
    <button class="tab" data-t="now">${ic('now')}Now</button><button class="tab" data-t="day">${ic('day')}Days</button>
    <button class="fab" id="fab" aria-label="Add expense">${ic('plus')}</button>
    <button class="tab" data-t="money">${ic('money')}Budget</button><button class="tab" data-t="info">${ic('info')}Info</button></div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.t));
  $('#fab').onclick = () => openExpense(null);
  $('#scrim').onclick = () => closeSheet();
  addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  setupBackGuard();
  safeRender(); life(true);
  if (crashNote) setTimeout(() => toast('It closed unexpectedly last time — Lite mode is on (Settings to change)'), 600);
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    life(true);
    const ae = document.activeElement;
    if (!sheetOpen && !(ae && ae.matches && ae.matches('input,textarea,select'))) safeRender();
  }, 30e3);
  document.addEventListener('visibilitychange', () => {
    const vis = document.visibilityState === 'visible';
    document.documentElement.classList.toggle('paused', !vis);
    life(vis);
    if (vis && !sheetOpen) safeRender();
  });
  addEventListener('pagehide', () => life(false));
  addEventListener('storage', e => { if (e.key === KEY){ S = load(); invalidate(); applyLite(); safeRender(); } });
}
boot();

</script>
